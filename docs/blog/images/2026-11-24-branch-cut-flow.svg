<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" font-family="system-ui, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">branch_base.cut() — three-path guard</text>

  <!-- Entry -->
  <rect x="250" y="40" width="160" height="36" rx="8" fill="#e8f0fe" stroke="#4285f4" stroke-width="1.5"/>
  <text x="330" y="63" text-anchor="middle" font-weight="600" fill="#1a56db">cut(branch, base)</text>

  <!-- Guard 1: base branch -->
  <rect x="40" y="120" width="180" height="36" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1.5"/>
  <text x="130" y="143" text-anchor="middle" fill="#c5221f">branch == base?</text>

  <line x1="290" y1="76" x2="130" y2="120" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Refuse -->
  <rect x="40" y="180" width="180" height="32" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
  <text x="130" y="201" text-anchor="middle" font-size="12" fill="#c5221f">refused: base branch</text>
  <line x1="130" y1="156" x2="130" y2="180" stroke="#ea4335" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="135" y="172" font-size="10" fill="#ea4335">yes</text>

  <!-- Guard 2: exists? -->
  <rect x="250" y="120" width="160" height="36" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="330" y="143" text-anchor="middle" fill="#e37400">branch exists?</text>

  <line x1="330" y1="76" x2="330" y2="120" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="102" font-size="10" fill="#555">no</text>

  <!-- Has base record? -->
  <rect x="250" y="200" width="160" height="36" rx="6" fill="#fef7e0" stroke="#f9ab00" stroke-width="1.5"/>
  <text x="330" y="223" text-anchor="middle" fill="#e37400">has base record?</text>

  <line x1="330" y1="156" x2="330" y2="200" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="335" y="182" font-size="10" fill="#f9ab00">yes</text>

  <!-- Resume path -->
  <rect x="170" y="280" width="160" height="36" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="250" y="303" text-anchor="middle" fill="#1e8e3e">checkout branch</text>

  <line x1="290" y1="236" x2="250" y2="280" stroke="#34a853" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="250" y="262" font-size="10" fill="#34a853">yes</text>

  <rect x="170" y="340" width="160" height="36" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1"/>
  <text x="250" y="361" text-anchor="middle" font-size="12" fill="#1e8e3e">resumed:parent</text>
  <line x1="250" y1="316" x2="250" y2="340" stroke="#34a853" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Unknown exists -->
  <rect x="430" y="280" width="200" height="36" rx="6" fill="#fce8e6" stroke="#ea4335" stroke-width="1"/>
  <text x="530" y="303" text-anchor="middle" font-size="12" fill="#c5221f">branch_exists:name</text>

  <line x1="370" y1="236" x2="530" y2="280" stroke="#ea4335" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="460" y="262" font-size="10" fill="#ea4335">no</text>

  <!-- Create new -->
  <rect x="460" y="120" width="180" height="36" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1.5"/>
  <text x="550" y="143" text-anchor="middle" fill="#1e8e3e">checkout -b branch</text>

  <line x1="410" y1="138" x2="460" y2="138" stroke="#555" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="435" y="132" font-size="10" fill="#555">no</text>

  <rect x="460" y="180" width="180" height="32" rx="6" fill="#e6f4ea" stroke="#34a853" stroke-width="1"/>
  <text x="550" y="201" text-anchor="middle" font-size="12" fill="#1e8e3e">record + return origin</text>
  <line x1="550" y1="156" x2="550" y2="180" stroke="#34a853" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <rect x="460" y="370" width="12" height="12" rx="2" fill="#e6f4ea" stroke="#34a853"/>
  <text x="478" y="381" font-size="11" fill="#555">success</text>
  <rect x="540" y="370" width="12" height="12" rx="2" fill="#fce8e6" stroke="#ea4335"/>
  <text x="558" y="381" font-size="11" fill="#555">error</text>
  <rect x="610" y="370" width="12" height="12" rx="2" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="628" y="381" font-size="11" fill="#555">guard</text>
</svg>
