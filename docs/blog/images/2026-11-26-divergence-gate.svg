<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <style>
    .stage { fill: #f0f4f8; stroke: #94a3b8; stroke-width: 1.5; rx: 6; }
    .gate { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; rx: 6; }
    .gate-new { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; rx: 6; }
    .moved { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; rx: 6; stroke-dasharray: 5,3; }
    .arrow { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
    .label { font-size: 12px; fill: #334155; text-anchor: middle; }
    .title { font-size: 14px; fill: #1e293b; font-weight: 600; text-anchor: start; }
    .sub { font-size: 11px; fill: #64748b; text-anchor: middle; }
    .divider { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 4,4; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Labels -->
  <text class="title" x="20" y="28">Before</text>
  <text class="title" x="20" y="198">After</text>
  <line class="divider" x1="20" y1="165" x2="700" y2="165"/>

  <!-- BEFORE row -->
  <rect class="stage" x="20" y="50" width="90" height="40"/>
  <text class="label" x="65" y="74">preflight</text>

  <line class="arrow" x1="110" y1="70" x2="140" y2="70"/>

  <rect class="stage" x="140" y="50" width="90" height="40"/>
  <text class="label" x="185" y="74">land</text>

  <line class="arrow" x1="230" y1="70" x2="260" y2="70"/>

  <rect class="stage" x="260" y="50" width="90" height="40"/>
  <text class="label" x="305" y="74">stamp</text>

  <line class="arrow" x1="350" y1="70" x2="380" y2="70"/>

  <rect class="stage" x="380" y="50" width="110" height="40"/>
  <text class="label" x="435" y="74">carry_strays</text>

  <line class="arrow" x1="490" y1="70" x2="520" y2="70"/>

  <rect class="moved" x="520" y="50" width="130" height="40"/>
  <text class="label" x="585" y="68" style="fill: #dc2626">divergence</text>
  <text class="label" x="585" y="82" style="fill: #dc2626">check here</text>

  <text class="sub" x="585" y="110">too late — work</text>
  <text class="sub" x="585" y="124">already landed</text>

  <!-- AFTER row -->
  <rect class="gate-new" x="20" y="220" width="130" height="40"/>
  <text class="label" x="85" y="238" style="fill: #15803d">preflight +</text>
  <text class="label" x="85" y="252" style="fill: #15803d">divergence gate</text>

  <line class="arrow" x1="150" y1="240" x2="175" y2="240"/>

  <rect class="stage" x="175" y="220" width="70" height="40"/>
  <text class="label" x="210" y="244">land</text>

  <line class="arrow" x1="245" y1="240" x2="265" y2="240"/>

  <rect class="gate-new" x="265" y="220" width="100" height="40"/>
  <text class="label" x="315" y="238" style="fill: #15803d">verify</text>
  <text class="label" x="315" y="252" style="fill: #15803d">advanced</text>

  <line class="arrow" x1="365" y1="240" x2="385" y2="240"/>

  <rect class="stage" x="385" y="220" width="70" height="40"/>
  <text class="label" x="420" y="244">stamp</text>

  <line class="arrow" x1="455" y1="240" x2="475" y2="240"/>

  <rect class="gate-new" x="475" y="220" width="100" height="40"/>
  <text class="label" x="525" y="238" style="fill: #15803d">reconcile</text>
  <text class="label" x="525" y="252" style="fill: #15803d">stamps</text>

  <line class="arrow" x1="575" y1="240" x2="595" y2="240"/>

  <rect class="stage" x="595" y="220" width="90" height="40"/>
  <text class="label" x="640" y="244">settle</text>

  <text class="sub" x="85" y="280">blocks if diverged</text>
  <text class="sub" x="315" y="280">SHA must advance</text>
  <text class="sub" x="525" y="280">orphans flagged</text>

  <!-- Legend -->
  <rect x="20" y="310" width="14" height="14" class="gate-new"/>
  <text class="sub" x="42" y="322" style="text-anchor: start">New gate</text>
  <rect x="120" y="310" width="14" height="14" class="moved"/>
  <text class="sub" x="142" y="322" style="text-anchor: start">Moved earlier</text>
  <rect x="240" y="310" width="14" height="14" class="stage"/>
  <text class="sub" x="262" y="322" style="text-anchor: start">Existing stage</text>
</svg>
